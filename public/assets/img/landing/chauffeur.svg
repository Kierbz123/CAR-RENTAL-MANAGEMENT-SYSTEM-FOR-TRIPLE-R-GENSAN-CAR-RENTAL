<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="t">
  <title id="t">Illustration of a chauffeur in uniform</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3a41"/><stop offset="1" stop-color="#132528"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#e3a45b" stop-opacity=".34"/><stop offset="1" stop-color="#e3a45b" stop-opacity="0"/></radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#31515a"/><stop offset="1" stop-color="#17292d"/></linearGradient>
  </defs>
  <rect width="480" height="560" fill="url(#bg)"/>
  <circle cx="240" cy="230" r="250" fill="url(#glow)"/>
  <circle cx="240" cy="236" r="176" fill="none" stroke="#e3a45b" stroke-opacity=".5" stroke-width="2"/>
